name: Daily live smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
      timezone: Europe/Amsterdam

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/smoke-test.sh
